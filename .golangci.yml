version: "2"

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - decorder
    - dupword
    - govet
    - ineffassign
    - misspell
    - nilerr
    - reassign
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    staticcheck:
      checks: ["all", "-SA4006", "-ST1000", "-ST1003", "-ST1005", "-ST1012", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1004", "-QF1008", "-QF1011", "-QF1012"]
  exclusions:
    rules:
      # Deliberate use of the deprecated sigs.k8s.io/cluster-api/api/core/v1beta1
      # package. CAPI v1.13.x only ships core types under this path (the legacy
      # api/v1beta1 path is gone) and this provider set intentionally implements
      # the v1beta1 InfrastructureCluster contract — spec REQ-003 mandates the
      # failureReason/failureMessage status fields that the v1beta2 contract
      # dropped. The deprecation warning is expected and safe here; SA1019 stays
      # enabled for every other deprecated API usage.
      - linters:
          - staticcheck
        text: 'SA1019: "sigs\.k8s\.io/cluster-api/api/core/v1beta1" is deprecated'

run:
  concurrency: 4
  timeout: 10m
  issues-exit-code: 1
  tests: true

formatters:
  enable:
    - gofmt
    - goimports
