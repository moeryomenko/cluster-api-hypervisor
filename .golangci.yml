version: "2"

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - decorder
    - dupword
    - govet
    - ineffassign
    - misspell
    - nilerr
    - reassign
    - staticcheck
    - unconvert
    - unused
    - wsl_v5
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    staticcheck:
      checks: ["all", "-SA4006", "-ST1000", "-ST1003", "-ST1005", "-ST1012", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1004", "-QF1008", "-QF1011", "-QF1012"]
  exclusions:
    rules:
      # Deliberate use of the old record.EventRecorder API via
      # manager.Manager.GetEventRecorderFor. The reconcilers' Recorder fields
      # are pinned to record.EventRecorder (the old events API) by the
      # controller contract this provider implements; mgr.GetEventRecorder
      # returns the incompatible new events.EventRecorder interface, so the
      # mandated replacement would require a multi-file migration of every
      # Recorder field and Eventf call site, which is a separate concern. The
      # deprecation warning is expected and safe here; SA1019 stays enabled for
      # every other deprecated API usage.
      - linters:
          - staticcheck
        text: 'SA1019: .+\.GetEventRecorderFor is deprecated: this uses the old events API'
      # Deliberate use of the deprecated EventBroadcaster option on
      # ctrl.Options. The manager runs as a single quadlet process for the
      # lifetime of the cluster, so the goroutine-leak risk the deprecation
      # warns about does not apply. The custom broadcaster configures a higher
      # event-correlator burst size to avoid filtered events under load.
      - linters:
          - staticcheck
        text: 'SA1019: \(sigs\.k8s\.io/controller-runtime\.Options\)\.EventBroadcaster is deprecated'

run:
  concurrency: 4
  timeout: 10m
  issues-exit-code: 1
  tests: true

formatters:
  enable:
    - gofmt
    - goimports
