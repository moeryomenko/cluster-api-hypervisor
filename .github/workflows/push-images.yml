# Build and push the cluster-api-hypervisor provider image to ghcr.io.

name: push-images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  GHCR_OWNER: moeryomenko
  IMAGE_BASE: cluster-api-hypervisor

jobs:
  push:
    name: build + push to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build provider image
        run: podman build -t "localhost/${IMAGE_BASE}:dev" -f Containerfile .

      - name: Push image to ghcr.io
        run: |
          podman tag "localhost/${IMAGE_BASE}:dev" \
            "ghcr.io/${GHCR_OWNER}/${IMAGE_BASE}:${{ steps.tag.outputs.tag }}"
          podman push "ghcr.io/${GHCR_OWNER}/${IMAGE_BASE}:${{ steps.tag.outputs.tag }}"