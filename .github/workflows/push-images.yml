# Build and push the cluster-api-hypervisor provider image to ghcr.io.

name: push-images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  GHCR_OWNER: moeryomenko
  IMAGE_BASE: cluster-api-hypervisor
  PROTOC_VERSION: 36.1
  PROTOC_GEN_GO_VERSION: v1.36.12
  PROTOC_GEN_GO_GRPC_VERSION: v1.6.2

jobs:
  push:
    name: build + push to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute immutable image reference
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=commit-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}

      - name: Install protoc Go plugins
        run: |
          bin="${RUNNER_TEMP}/protoc-bin"
          GOBIN="$bin" go install google.golang.org/protobuf/cmd/protoc-gen-go@"${PROTOC_GEN_GO_VERSION}"
          GOBIN="$bin" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@"${PROTOC_GEN_GO_GRPC_VERSION}"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Run local release gate
        run: make release-gate RELEASE_IMAGE="localhost/${IMAGE_BASE}:dev"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to ghcr.io
        run: |
          ref="ghcr.io/${GHCR_OWNER}/${IMAGE_BASE}:${{ steps.tag.outputs.tag }}"
          podman tag "localhost/${IMAGE_BASE}:dev" "$ref"
          podman push "$ref"
          digest="$(podman image inspect --format '{{index .RepoDigests 0}}' "$ref")"
          test -n "$digest"
          printf 'Published immutable image: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"