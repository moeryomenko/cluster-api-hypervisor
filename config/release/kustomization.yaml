# In-kind provider release overlay. The manager runs inside Kubernetes and
# serves admission through webhook-service; no host URL rewrites or capishim
# kubeconfig mounts are part of the provider release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../crd
- ../rbac
- ../webhook
- ../manager

labels:
- includeSelectors: false
  pairs:
    cluster.x-k8s.io/provider: infrastructure-hypervisor
    clusterctl.cluster.x-k8s.io: ""
