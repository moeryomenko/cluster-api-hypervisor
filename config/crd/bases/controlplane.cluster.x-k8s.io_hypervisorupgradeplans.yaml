---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: hypervisorupgradeplans.controlplane.cluster.x-k8s.io
spec:
  group: controlplane.cluster.x-k8s.io
  names:
    kind: HypervisorUpgradePlan
    listKind: HypervisorUpgradePlanList
    plural: hypervisorupgradeplans
    singular: hypervisorupgradeplan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster the plan upgrades
      jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - description: Target Kubernetes version
      jsonPath: .spec.toVersion
      name: To
      type: string
    - description: Plan lifecycle phase
      jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HypervisorUpgradePlan is the Schema for the hypervisorupgradeplans API. It
          declaratively plans and executes a Kubernetes version upgrade of a lab
          cluster: the plan controller sequences each version step control-plane
          first (through the CAPI topology and the provider's replace-in-place
          control plane rolling) and then workers (by unpausing the cluster's
          MachineDeployments), while the control plane controller snapshots and
          restores etcd around every control plane Machine replacement.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HypervisorUpgradePlanSpec defines the desired state of a
              HypervisorUpgradePlan.
            properties:
              clusterName:
                description: |-
                  ClusterName is the name of the Cluster the plan upgrades. The plan
                  resolves the Cluster in its own namespace.
                minLength: 1
                type: string
              steps:
                description: |-
                  Steps lists the ordered intermediate Kubernetes versions the upgrade
                  passes through before ToVersion, for multi-minor jumps that must respect
                  kubelet/apiserver skew. Each entry must be strictly greater than the
                  previous one and the last entry must equal ToVersion. When empty the
                  plan upgrades directly to ToVersion in one step.
                items:
                  type: string
                type: array
              toVersion:
                description: |-
                  ToVersion is the target Kubernetes version of the upgrade, v-prefixed
                  semver (e.g. "v1.38.0"). It must be strictly greater than the version
                  the cluster currently runs.
                minLength: 1
                type: string
            required:
            - clusterName
            - toVersion
            type: object
          status:
            description: |-
              HypervisorUpgradePlanStatus defines the observed state of a
              HypervisorUpgradePlan.
            properties:
              conditions:
                description: Conditions defines current service state of the plan.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentStep:
                description: |-
                  CurrentStep is the index into the resolved steps (0-based) the plan is
                  currently executing.
                type: integer
              failureMessage:
                description: |-
                  FailureMessage is a human-readable message for the failure that moved
                  the plan to Failed.
                type: string
              failureReason:
                description: |-
                  FailureReason is a machine-readable reason for the failure that moved
                  the plan to Failed.
                type: string
              fromVersion:
                description: |-
                  FromVersion is the Kubernetes version the cluster ran when the plan
                  started executing.
                type: string
              phase:
                description: Phase is the lifecycle phase of the plan.
                type: string
              steps:
                description: Steps reports the observed state of every resolved step.
                items:
                  description: |-
                    UpgradeStepStatus reports the observed state of one version step of the
                    plan.
                  properties:
                    phase:
                      description: |-
                        Phase is the phase the step reached: RollingControlPlane,
                        RollingWorkers, or Completed.
                      type: string
                    version:
                      description: Version is the Kubernetes version this step upgrades
                        the cluster to.
                      type: string
                  required:
                  - phase
                  - version
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
