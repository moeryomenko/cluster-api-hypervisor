---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: hypervisorclustertemplates.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    kind: HypervisorClusterTemplate
    listKind: HypervisorClusterTemplateList
    plural: hypervisorclustertemplates
    singular: hypervisorclustertemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HypervisorClusterTemplate is the Schema for the hypervisorclustertemplates
          API. It is the ClusterClass-compatible template kind the topology
          controller clones into a concrete HypervisorCluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HypervisorClusterTemplateSpec defines the desired state of
              HypervisorClusterTemplate.
            properties:
              template:
                description: |-
                  Template is the specification of the desired behavior of the
                  HypervisorCluster created from this template.
                properties:
                  metadata:
                    description: |-
                      ObjectMeta is the standard object metadata of the cluster created from
                      this template.
                    type: object
                  spec:
                    description: Spec is the specification of the desired behavior
                      of the cluster.
                    properties:
                      clusterName:
                        description: ClusterName is the name of the Cluster this object
                          belongs to.
                        type: string
                      controlPlaneEndpoint:
                        description: |-
                          ControlPlaneEndpoint is the workload cluster's API server endpoint.
                          This field is part of the Cluster API infrastructure-cluster contract:
                          the CAPI cluster controller reads spec.controlPlaneEndpoint from this
                          object and copies it to the Cluster's spec.controlPlaneEndpoint, which
                          drives the cluster phase transition to Provisioned. The host is
                          127.0.0.1 (the management plane reaches the VM through the host-side
                          passt forwarding) and the port is the k8netd-published host port for
                          the API server.
                        minProperties: 1
                        properties:
                          host:
                            description: host is the hostname on which the API server
                              is serving.
                            maxLength: 512
                            minLength: 1
                            type: string
                          port:
                            description: port is the port on which the API server
                              is serving.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                        type: object
                      images:
                        description: |-
                          Images maps Kubernetes versions to the host paths of the base images
                          the VMs of those versions boot from. The machine controller resolves
                          the image for a Machine through the Machine's spec.version: a version
                          without an entry fails machine provisioning closed (an upgrade can
                          never silently boot the wrong image), while a Machine without a
                          version keeps booting the provider's default base image. Upgrades
                          declared through a HypervisorUpgradePlan require every planned version
                          to have an entry here.
                        items:
                          description: |-
                            ImageRef maps one Kubernetes version to the host path of the base image
                            the VMs of that version boot from.
                          properties:
                            path:
                              description: |-
                                Path is the host path of the base image (qcow2) for Version. The
                                machine controller passes it to qemu-img convert when the machine's
                                root disk is first created.
                              minLength: 1
                              type: string
                            version:
                              description: |-
                                Version is the Kubernetes version the image carries, v-prefixed
                                semver (e.g. "v1.38.0").
                              minLength: 1
                              type: string
                          required:
                          - path
                          - version
                          type: object
                        type: array
                      network:
                        description: |-
                          Network defines the cluster's host-side network stack: the bridge, the
                          NAT table, and the static IP pool the Machine controllers allocate from.
                        properties:
                          bridgeName:
                            description: BridgeName is the Linux bridge the Machine
                              TAPs attach to, e.g. "k8sbr0".
                            type: string
                          cidr:
                            description: CIDR is the cluster subnet, e.g. "192.168.124.0/24".
                            type: string
                          dnsIP:
                            description: DNSIP is the address the DNS forwarder listens
                              on, e.g. "192.168.124.1".
                            type: string
                          gateway:
                            description: Gateway is the address served on the bridge,
                              e.g. "192.168.124.1".
                            type: string
                          natTable:
                            description: NATTable is the nftables table used for NAT
                              and forwarding rules, e.g. "k8slab".
                            type: string
                        type: object
                    type: object
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: true
