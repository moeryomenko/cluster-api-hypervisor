apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: hypervisorconfigtemplates.bootstrap.cluster.x-k8s.io
spec:
  group: bootstrap.cluster.x-k8s.io
  names:
    kind: HypervisorConfigTemplate
    listKind: HypervisorConfigTemplateList
    plural: hypervisorconfigtemplates
    singular: hypervisorconfigtemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HypervisorConfigTemplate is the Schema for the hypervisorconfigtemplates
          API. It is the ClusterClass-compatible template kind the MachineDeployment
          controller clones into a concrete HypervisorConfig per worker Machine;
          nodeName stays unset here and defaults to each owning Machine's name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HypervisorConfigTemplateSpec defines the desired state of
              HypervisorConfigTemplate.
            properties:
              template:
                description: |-
                  Template is the specification of the desired behavior of the
                  HypervisorConfig created from this template.
                properties:
                  metadata:
                    description: |-
                      ObjectMeta is the standard object metadata of the configs created from
                      this template.
                    type: object
                  spec:
                    description: Spec is the specification of the desired behavior
                      of the config.
                    properties:
                      clusterName:
                        description: ClusterName is the name of the Cluster this object
                          belongs to.
                        type: string
                      nodeName:
                        description: |-
                          NodeName is the name of the node the bootstrap data is rendered for.
                          Defaults to the owning Machine's name.
                        type: string
                      role:
                        description: |-
                          Role is the node role the bootstrap data is rendered for, either
                          "control-plane" or "worker". Defaults to the role derived from the
                          owning Machine's labels.
                        type: string
                      sshPublicKey:
                        description: |-
                          SSHPublicKey is an optional SSH public key added to the node's
                          authorized_keys. When empty the cluster-level key is used.
                        type: string
                    required:
                    - clusterName
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: true
