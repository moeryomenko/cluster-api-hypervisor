  names:
    kind: HypervisorMachine
    listKind: HypervisorMachineList
    plural: hypervisormachines
    singular: hypervisormachine
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HypervisorMachine is the Schema for the hypervisormachines API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HypervisorMachineSpec defines the desired state of HypervisorMachine.
            properties:
              clusterName:
                description: ClusterName is the name of the Cluster this object belongs
                  to.
                type: string
              cpu:
                description: CPU is the number of vCPUs allocated to the VM.
                format: int32
                type: integer
              disk:
                description: Disk is the root disk size in MiB.
                format: int32
                type: integer
              mac:
                description: |-
                  MAC is an optional override for the VM MAC address. When empty the
                  controller derives the address from a stable hash of cluster/machine
                  name.
                type: string
              ram:
                description: RAM is the VM memory in MiB.
                format: int32
                type: integer
              retainDiskOnDelete:
                description: |-
                  RetainDiskOnDelete determines whether the root disk survives VM
                  deletion. Defaults to false: the disk is removed with the VM.
                type: boolean
            type: object
          status:
            description: HypervisorMachineStatus defines the observed state of HypervisorMachine.
            properties:
              addresses:
                description: |-
                  Addresses is the list of addresses for the VM: the allocated static IP
                  and the machine hostname.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: Conditions defines current service state of the HypervisorMachine.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
