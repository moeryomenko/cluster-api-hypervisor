                  type: object
                type: array
              failureMessage:
                description: FailureMessage is a human-readable message for the last
                  failure.
                type: string
              failureReason:
                description: FailureReason is a machine-readable reason for the last
                  failure.
                type: string
              providerID:
                description: |-
                  ProviderID is the infrastructure provider ID in the form
