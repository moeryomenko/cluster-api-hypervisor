syntax = "proto3";

package k8labs.agent.v1;

option go_package = "github.com/moeryomenko/cluster-api-hypervisor/api/agent/v1;agentv1";

message Owner {
  string installation_id = 1;
  string node_id = 2;
  string uid = 3;
}

message Mutation {
  uint32 protocol_major = 1;
  Owner owner = 2;
  uint64 generation = 3;
  string idempotency_key = 4;
}

message HealthRequest {
  uint32 protocol_major = 1;
}

message Capabilities {
  uint32 protocol_major = 1;
  string node_id = 2;
  string cloud_hypervisor = 3;
  uint32 k8netd_protocol_major = 4;
  bool can_use_kvm = 5;
  bool can_use_user_dbus = 6;
}

message VMDesired {
  string uid = 1;
  string name = 2;
  string image = 3;
  string firmware = 4;
  string api_socket = 5;
  string vhost_socket = 6;
  string disk = 7;
  string mac = 8;
  string ip = 9;
  uint32 cpus = 10;
  uint32 memory_mib = 11;
  repeated string additional_disks = 12;
  string disk_sha256 = 13;
  repeated string additional_disk_sha256 = 14;
}

message VMObserved {
  string uid = 1;
  string unit = 2;
  int64 pid = 3;
  uint64 guest_uptime = 4;
  bool running = 5;
  string api_socket = 6;
  string vhost_socket = 7;
  string ip = 8;
  string mac = 9;
  uint64 generation = 10;
}

message NetworkRequest {
  string name = 1;
  string cidr = 2;
}

message PortRequest {
  string name = 1;
  string network = 2;
  string mac = 3;
}

message PortObserved {
  string name = 1;
  string network = 2;
  string mac = 3;
  string ip = 4;
  map<uint32, uint32> published = 5;
}

message Diagnostics {
  string owner_uid = 1;
  repeated string messages = 2;
}

message ProbeLease {
  string uid = 1;
  string network = 2;
  string port = 3;
  string mac = 4;
  string ip = 5;
  int64 expires_at = 6;
}

message EnsureVMRequest {
  Mutation mutation = 1;
  VMDesired desired = 2;
}

message GetVMRequest {
  Owner owner = 1;
  uint32 protocol_major = 2;
}

message VMResponse {
  VMObserved observed = 1;
}

message MutationRequest {
  Mutation mutation = 1;
}

message EnsureNetworkRequest {
  Mutation mutation = 1;
  NetworkRequest network = 2;
}

message EnsurePortRequest {
  Mutation mutation = 1;
  PortRequest port = 2;
}

message PortResponse {
  PortObserved observed = 1;
}

message AllocateIPResponse {
  string ip = 1;
}

message ReleaseIPRequest {
  Mutation mutation = 1;
  string ip = 2;
}

message PublishPortRequest {
  Mutation mutation = 1;
  uint32 guest_port = 2;
  uint32 host_port = 3;
}

message PublishPortResponse {
  uint32 host_port = 1;
}

message ReleasePortRequest {
  Mutation mutation = 1;
  uint32 guest_port = 2;
  uint32 host_port = 3;
}

message DiagnosticsRequest {
  Owner owner = 1;
  uint32 protocol_major = 2;
}

message DiagnosticsResponse {
  Diagnostics diagnostics = 1;
}

message AcquireProbeRequest {
  Mutation mutation = 1;
  string network = 2;
}

message ProbeResponse {
  ProbeLease lease = 1;
}

message ReleaseProbeRequest {
  Mutation mutation = 1;
  string uid = 2;
}

message ArtifactFile {
  string name = 1;
  bytes content = 2;
}

message PrepareRootDiskRequest {
  Mutation mutation = 1;
  string name = 2;
  string source_image = 3;
}

message PrepareCIDATARequest {
  Mutation mutation = 1;
  string name = 2;
  repeated ArtifactFile files = 3;
}

message PrepareConfextRequest {
  Mutation mutation = 1;
  string name = 2;
  repeated ArtifactFile files = 3;
}

message ArtifactResponse {
  repeated string paths = 1;
  repeated string sha256 = 2;
}

message Empty {}

service HostAgent {
  rpc Health(HealthRequest) returns (Capabilities);
  rpc EnsureVM(EnsureVMRequest) returns (VMResponse);
  rpc GetVM(GetVMRequest) returns (VMResponse);
  rpc StopVM(MutationRequest) returns (Empty);
  rpc DeleteVM(MutationRequest) returns (Empty);
  rpc EnsureNetwork(EnsureNetworkRequest) returns (Empty);
  rpc DeleteNetwork(MutationRequest) returns (Empty);
  rpc EnsurePort(EnsurePortRequest) returns (PortResponse);
  rpc DeletePort(MutationRequest) returns (Empty);
  rpc AllocateIP(MutationRequest) returns (AllocateIPResponse);
  rpc ReleaseIP(ReleaseIPRequest) returns (Empty);
  rpc PublishPort(PublishPortRequest) returns (PublishPortResponse);
  rpc ReleasePort(ReleasePortRequest) returns (Empty);
  rpc Diagnostics(DiagnosticsRequest) returns (DiagnosticsResponse);
  rpc AcquireProbe(AcquireProbeRequest) returns (ProbeResponse);
  rpc ReleaseProbe(ReleaseProbeRequest) returns (Empty);
  rpc PrepareRootDisk(PrepareRootDiskRequest) returns (ArtifactResponse);
  rpc PrepareCIDATA(PrepareCIDATARequest) returns (ArtifactResponse);
  rpc PrepareConfext(PrepareConfextRequest) returns (ArtifactResponse);
}
